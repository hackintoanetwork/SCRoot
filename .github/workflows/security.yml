name: Security

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          languages: java-kotlin
          build-mode: manual
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          validate-wrappers: true
      - run: sh -n build.sh
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/verify_release_assets.py
      - run: python3 tools/verify_corresponding_source.py
      - run: ./gradlew --no-daemon --no-build-cache --rerun-tasks clean testDebugUnitTest testReleaseUnitTest lintRelease assembleRelease
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
