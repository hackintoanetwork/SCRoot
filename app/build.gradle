plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystorePath = providers.environmentVariable("SCR01_RELEASE_KEYSTORE")
        .orNull
def releaseStorePassword = providers.environmentVariable("SCR01_RELEASE_STORE_PASSWORD")
        .orNull
def releaseKeyAlias = providers.environmentVariable("SCR01_RELEASE_KEY_ALIAS")
        .orElse("scr01")
        .get()
def releaseKeyPassword = providers.environmentVariable("SCR01_RELEASE_KEY_PASSWORD")
        .orNull

android {
    namespace 'com.scr01.scroot'
    compileSdk 34

    defaultConfig {
        applicationId "com.scr01.scroot"
        minSdk 30
        targetSdk 30
        versionCode 3
        versionName "1.1.1"
        ndk { abiFilters 'arm64-v8a' }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            excludes += ['**/libcrown.so']
        }
    }

    signingConfigs {
        if (releaseKeystorePath && releaseStorePassword && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def releaseConfig = signingConfigs.findByName("release")
            if (releaseConfig != null) signingConfig releaseConfig
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        checkReleaseBuilds true
        abortOnError true

        disable 'ExpiredTargetSdkVersion', 'ChromeOsAbiSupport', 'ObsoleteSdkInt'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
